name: antecipe

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: antecipe
      POSTGRES_DB: antecipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode make up para gerar o .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      # -h 127.0.0.1: confere o TCP (na primeira subida o servidor temporário só atende pelo socket)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U antecipe -d antecipe"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://antecipe:${POSTGRES_PASSWORD}@postgres:5432/antecipe?sslmode=disable
      GESTOR_SENHA: ${GESTOR_SENHA:?rode make up para gerar o .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_PATH: /app/config/antecipe.yaml
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      OTEL_SERVICE_NAME: antecipe-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"   # interface dos traces
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Assistente de IA (Agno + AgentOS, modelo via OpenRouter). Consulta a API como o front faz.
  # Sem OPENROUTER_API_KEY ele sobe do mesmo jeito e /assistente/status responde disponivel=false.
  ai:
    restart: unless-stopped
    build: ./ai
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODELO: ${AI_MODELO:-}
      ANTECIPE_API_URL: http://api:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: antecipe
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_DATABASE: antecipe
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      AGNO_TELEMETRY: "false"
    ports:
      - "7777:7777"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
      - ai

volumes:
  pgdata:
