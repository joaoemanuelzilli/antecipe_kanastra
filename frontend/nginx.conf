server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Lotes de até 500 mil linhas (~100 MB)
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Assistente de IA: /ai/agents/antecipe-assistente/runs → AgentOS. Sem buffer para o streaming (SSE).
    location /ai/ {
        proxy_pass http://ai:7777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
