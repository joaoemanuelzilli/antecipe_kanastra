[project]
name = "antecipe-ai"
version = "1.0.0"
description = "Assistente do Antecipe: agente Agno servido pelo AgentOS que responde em linguagem natural sobre lotes, notas e regras."
requires-python = ">=3.12,<4"
dependencies = [
  "agno[os]==3.1.3",
  "openai",          # cliente OpenAI-compatível que o modelo OpenRouter do Agno usa
  "httpx",           # chamadas à API do Antecipe (Go)
  "sqlalchemy",      # sessões do chat no Postgres
  "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
